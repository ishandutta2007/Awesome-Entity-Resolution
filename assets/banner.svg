<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Glowing Node Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Filters for Glow Effects -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Animated Pulse Keyframes -->
    <style>
      @keyframes pulseBeam {
        0%, 100% { stroke-dashoffset: 0; opacity: 0.9; }
        50% { stroke-dashoffset: 60; opacity: 0.35; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-8px) scale(1.03); }
      }
      @keyframes floatFast {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-12px); }
      }
      @keyframes glowPulse {
        0%, 100% { opacity: 0.75; filter: drop-shadow(0 0 10px rgba(99,102,241,0.6)); }
        50% { opacity: 1; filter: drop-shadow(0 0 24px rgba(236,72,153,0.9)); }
      }
      .link-beam-1 {
        stroke-dasharray: 8 12;
        animation: pulseBeam 4s linear infinite;
      }
      .link-beam-2 {
        stroke-dasharray: 6 10;
        animation: pulseBeam 3s linear infinite reverse;
      }
      .floating-node-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-node-2 { animation: floatFast 4.5s ease-in-out infinite; }
      .floating-node-3 { animation: floatSlow 5.2s ease-in-out infinite reverse; }
      .title-glow { animation: glowPulse 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Subtle Cybernetic Grid Pattern -->
  <g opacity="0.10">
    <path d="M0,40 H1200 M0,80 H1200 M0,120 H1200 M0,160 H1200 M0,200 H1200 M0,240 H1200 M0,280 H1200" stroke="#6366f1" stroke-width="1"/>
    <path d="M80,0 V320 M160,0 V320 M240,0 V320 M320,0 V320 M400,0 V320 M480,0 V320 M560,0 V320 M640,0 V320 M720,0 V320 M800,0 V320 M880,0 V320 M960,0 V320 M1040,0 V320 M1120,0 V320" stroke="#6366f1" stroke-width="1"/>
  </g>

  <!-- Entity Resolution Connecting Graph Network (Left Background) -->
  <g opacity="0.85">
    <!-- Links / Resolution Edges -->
    <line x1="80" y1="80" x2="160" y2="160" stroke="#38bdf8" stroke-width="2" class="link-beam-1"/>
    <line x1="160" y1="160" x2="110" y2="240" stroke="#8b5cf6" stroke-width="2" class="link-beam-2"/>
    <line x1="160" y1="160" x2="250" y2="140" stroke="#ec4899" stroke-width="2.5" class="link-beam-1" filter="url(#glow)"/>
    <line x1="250" y1="140" x2="220" y2="250" stroke="#2dd4bf" stroke-width="1.8" class="link-beam-2"/>
    <line x1="80" y1="80" x2="250" y2="140" stroke="#6366f1" stroke-width="1.2" stroke-dasharray="4 6" opacity="0.5"/>

    <!-- Nodes / Entities -->
    <g class="floating-node-1">
      <circle cx="80" cy="80" r="16" fill="url(#primaryGrad)" filter="url(#glow)"/>
      <circle cx="80" cy="80" r="7" fill="#ffffff"/>
      <text x="80" y="112" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Entity A₁</text>
    </g>

    <g class="floating-node-2">
      <circle cx="110" cy="240" r="14" fill="url(#accentGrad)" filter="url(#glow)"/>
      <circle cx="110" cy="240" r="6" fill="#ffffff"/>
      <text x="110" y="270" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Entity A₂</text>
    </g>

    <g class="floating-node-3">
      <circle cx="160" cy="160" r="22" fill="url(#cyanGrad)" filter="url(#superGlow)"/>
      <circle cx="160" cy="160" r="10" fill="#ffffff"/>
      <text x="160" y="198" fill="#38bdf8" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">MATCH</text>
    </g>

    <g class="floating-node-1">
      <circle cx="250" cy="140" r="26" fill="url(#goldGrad)" filter="url(#superGlow)"/>
      <circle cx="250" cy="140" r="12" fill="#ffffff"/>
      <text x="250" y="180" fill="#fbbf24" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">GOLDEN ID</text>
    </g>

    <g class="floating-node-2">
      <circle cx="220" cy="250" r="13" fill="url(#primaryGrad)" opacity="0.8"/>
      <circle cx="220" cy="250" r="5" fill="#ffffff"/>
      <text x="220" y="276" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">Record B</text>
    </g>
  </g>

  <!-- Central Brand & Title Section -->
  <g transform="translate(620, 160)">
    <!-- Main Title -->
    <text x="0" y="-30" fill="#ffffff" font-size="42" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-weight="900" text-anchor="middle" letter-spacing="-0.5" class="title-glow">
      Awesome Entity Resolution
    </text>

    <!-- Subtitle Badge -->
    <rect x="-290" y="-12" width="580" height="34" rx="17" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5" opacity="0.9"/>
    <text x="0" y="10" fill="#a5b4fc" font-size="13" font-family="system-ui, -apple-system, sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1.2">
      RECORD LINKAGE • DEDUPLICATION • IDENTITY RESOLUTION • MDM
    </text>

    <!-- Description Tagline -->
    <text x="0" y="65" fill="#94a3b8" font-size="15" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" font-weight="400">
      Curated Ecosystem of Open-Source Tools, Algorithms, SaaS Platforms &amp; Frameworks
    </text>
  </g>

  <!-- Entity Resolution Connecting Graph Network (Right Background) -->
  <g opacity="0.85">
    <line x1="970" y1="100" x2="1060" y2="170" stroke="#ec4899" stroke-width="2" class="link-beam-1"/>
    <line x1="1060" y1="170" x2="1130" y2="90" stroke="#38bdf8" stroke-width="2" class="link-beam-2"/>
    <line x1="1060" y1="170" x2="1030" y2="250" stroke="#fbbf24" stroke-width="2.2" class="link-beam-1" filter="url(#glow)"/>
    <line x1="1030" y1="250" x2="1120" y2="230" stroke="#2dd4bf" stroke-width="1.8" class="link-beam-2"/>

    <g class="floating-node-2">
      <circle cx="970" cy="100" r="15" fill="url(#cyanGrad)" filter="url(#glow)"/>
      <circle cx="970" cy="100" r="6" fill="#ffffff"/>
      <text x="970" y="130" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">Person Record</text>
    </g>

    <g class="floating-node-1">
      <circle cx="1130" cy="90" r="14" fill="url(#primaryGrad)" filter="url(#glow)"/>
      <circle cx="1130" cy="90" r="5" fill="#ffffff"/>
      <text x="1130" y="120" fill="#94a3b8" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="600">CRM Contact</text>
    </g>

    <g class="floating-node-3">
      <circle cx="1060" cy="170" r="24" fill="url(#accentGrad)" filter="url(#superGlow)"/>
      <circle cx="1060" cy="170" r="11" fill="#ffffff"/>
      <text x="1060" y="206" fill="#f472b6" font-size="12" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">CLUSTER</text>
    </g>

    <g class="floating-node-1">
      <circle cx="1030" cy="250" r="22" fill="url(#goldGrad)" filter="url(#superGlow)"/>
      <circle cx="1030" cy="250" r="9" fill="#ffffff"/>
      <text x="1030" y="286" fill="#fbbf24" font-size="11" font-family="system-ui, sans-serif" text-anchor="middle" font-weight="bold">CUSTOMER 360</text>
    </g>

    <g class="floating-node-2">
      <circle cx="1120" cy="230" r="13" fill="url(#cyanGrad)" opacity="0.8"/>
      <circle cx="1120" cy="230" r="5" fill="#ffffff"/>
      <text x="1120" y="258" fill="#94a3b8" font-size="10" font-family="system-ui, sans-serif" text-anchor="middle">KYC / AML</text>
    </g>
  </g>
</svg>
